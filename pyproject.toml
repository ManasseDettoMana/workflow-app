[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workflowapp"
version = "0.2.0"
description = "Gestore personale di ticket e attivita per Windows"
readme = "README.md"
# 3.11 rather than 3.10: tomllib is in the standard library from 3.11, and
# date.fromisoformat stops being strict about the exact YYYY-MM-DD spelling.
# Nothing here needs 3.10, and the machine this runs on is on 3.13.
requires-python = ">=3.11"
authors = [{ name = "ManasseDettoMana" }]
dependencies = ["PySide6>=6.7"]

# The GUI entry point is declared in Phase 4, when workflowapp.gui.app exists.
# Declaring it earlier installs a script that raises ImportError.

[tool.setuptools.packages.find]
include = ["workflowapp*"]

# The stylesheets are loaded at runtime from the installed package. Without this
# they work from a source checkout and are missing from an installed or frozen
# build, where the application starts unstyled and nothing says why. Declared
# against workflowapp.gui rather than a themes package so that themes/ needs no
# __init__.py of its own.
[tool.setuptools.package-data]
"workflowapp.gui" = ["themes/*.qss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gui: test needs a Qt application instance",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
