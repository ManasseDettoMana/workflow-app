[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workflowapp"
version = "1.1.0"
description = "Gestore personale di ticket e attivita per Windows"
readme = "README.md"
# 3.11 rather than 3.10: tomllib is in the standard library from 3.11, and
# date.fromisoformat stops being strict about the exact YYYY-MM-DD spelling.
# Nothing here needs 3.10, and the machine this runs on is on 3.13.
requires-python = ">=3.11"
authors = [{ name = "ManasseDettoMana" }]
dependencies = ["PySide6>=6.7"]

# gui-scripts rather than scripts: on Windows the former is launched by pythonw
# and opens no console window behind the application.
[project.gui-scripts]
workflowapp = "workflowapp.gui.app:main"

[tool.setuptools.packages.find]
include = ["workflowapp*"]

# The stylesheets and the icon are loaded at runtime from the installed package.
# Without this they work from a source checkout and are missing from an installed
# or frozen build, where the application starts unstyled and nothing says why.
# Declared against workflowapp.gui rather than themes and assets packages so that
# neither directory needs an __init__.py of its own.
[tool.setuptools.package-data]
"workflowapp.gui" = ["themes/*.qss", "assets/*.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gui: test needs a Qt application instance",
]
# A deprecation warning from PySide6 is how a Qt call announces it will stop
# working in a future release, which is exactly the thing worth hearing about
# early rather than at upgrade time.
filterwarnings = [
    "error::DeprecationWarning:workflowapp.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
